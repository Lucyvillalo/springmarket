<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Market - Productos</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #f4f7ef; color: #111827; }
        .admin-shell { min-height: 100vh; display: grid; grid-template-columns: 255px 1fr; }

        /* ── Sidebar ── */
        .admin-sidebar {
          background: #b8f2c9; border-right: 1px solid rgba(34,197,94,.25);
          padding: 22px 20px; display: flex; flex-direction: column; gap: 42px;
          position: sticky; top: 0; height: 100vh;
        }
        .brand { display: flex; align-items: center; gap: 9px; color: #19c45b; font-weight: 800; font-size: 16px; }
        .brand-mark {
          width: 24px; height: 24px; border-radius: 50%;
          background: #16d45b; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px;
        }
        .side-nav { display: flex; flex-direction: column; gap: 14px; margin-top: 34px; }
        .side-item {
          display: flex; align-items: center; gap: 11px; padding: 10px 7px;
          color: #345246; text-decoration: none; font-size: 13px; border-radius: 8px;
          border: 0; background: transparent; cursor: pointer; font-family: var(--font-main);
        }
        .side-item.active, .side-item:hover { color: #153826; background: rgba(255,255,255,.32); }
        .side-icon { width: 18px; text-align: center; opacity: .8; }
        .logout { margin-top: auto; color: #ef4444; }

        /* ── Main ── */
        .prod-main { padding: 24px 28px 36px; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
        .top-actions { margin-left: auto; display: flex; align-items: center; gap: 18px; color: #34475d; }
        .manager { display: flex; align-items: center; gap: 12px; padding-left: 18px; border-left: 1px solid #dbe3dc; }
        .manager-name { font-size: 12px; font-weight: 800; line-height: 1.1; text-align: right; }
        .manager-role { display: block; font-size: 8px; color: #64748b; letter-spacing: .08em; }
        .avatar {
          width: 34px; height: 34px; border-radius: 50%; border: 2px solid #dbeafe;
          background: #1f2937; color: #fff; display: grid; place-items: center; font-weight: 800;
        }

        /* ── Page header ── */
        .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
        .page-header h1 { font-size: 26px; font-weight: 800; margin: 0 0 3px; }
        .page-header p { color: #64748b; font-size: 13px; margin: 0; }
        .btn-primary {
          background: #19c45b; color: #fff; border: 0; border-radius: 8px;
          padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
          display: flex; align-items: center; gap: 7px; transition: background .15s;
        }
        .btn-primary:hover { background: #15ad4e; }

        /* ── Toolbar ── */
        .toolbar {
          display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap;
        }
        .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
        .search-wrap input {
          width: 100%; height: 36px; border: 1px solid #e2e8f0; border-radius: 8px;
          padding: 0 12px 0 34px; font-size: 13px; background: #fff; color: #111827;
        }
        .search-wrap::before {
          content: '🔍'; position: absolute; left: 10px; top: 50%;
          transform: translateY(-50%); font-size: 13px; pointer-events: none;
        }
        .toolbar select {
          height: 36px; border: 1px solid #e2e8f0; border-radius: 8px;
          padding: 0 12px; font-size: 13px; background: #fff; color: #374151; cursor: pointer;
        }

        /* ── Catalog grid ── */
        .cat-grid {
          display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
        }
        .prod-card {
          background: #fff; border: 1px solid #e6ebef; border-radius: 12px;
          padding: 18px; box-shadow: 0 2px 8px rgba(15,23,42,.04); transition: box-shadow .15s;
        }
        .prod-card:hover { box-shadow: 0 4px 18px rgba(15,23,42,.10); }
        .prod-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .prod-icon {
          width: 42px; height: 42px; border-radius: 10px;
          background: #d1fae5; color: #059669; display: grid; place-items: center;
          font-size: 22px; line-height: 1;
        }
        .prod-badge {
          font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 99px;
        }
        .badge-ok  { background: #d1fae5; color: #065f46; }
        .badge-low { background: #fef3c7; color: #92400e; }
        .badge-out { background: #fee2e2; color: #991b1b; }
        .prod-name { font-size: 14px; font-weight: 800; margin: 0 0 3px; color: #111827; }
        .prod-meta { font-size: 11px; color: #9ca3af; margin-bottom: 10px; }
        .prod-price { font-size: 18px; font-weight: 900; color: #19c45b; margin-bottom: 4px; }
        .prod-stock-line { font-size: 11px; color: #64748b; margin-bottom: 14px; }
        .card-actions { display: flex; gap: 8px; }
        .btn-edit, .btn-del {
          flex: 1; padding: 7px 0; border-radius: 7px; font-size: 12px;
          font-weight: 700; border: 0; cursor: pointer; transition: opacity .15s;
        }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
        .btn-edit:hover { background: #bae6fd; }
        .btn-del  { background: #fee2e2; color: #991b1b; }
        .btn-del:hover  { background: #fecaca; }

        /* ── Empty / loading states ── */
        .state-msg {
          grid-column: 1/-1; text-align: center; padding: 48px 0;
          color: #9ca3af; font-size: 14px;
        }

        /* ── Alert bar ── */
        #alert-box {
          display: none; margin-bottom: 16px; padding: 11px 16px; border-radius: 8px;
          font-size: 13px; font-weight: 600;
        }
        #alert-box.show { display: block; }
        #alert-box.alert-success { background: #d1fae5; color: #065f46; }
        #alert-box.alert-danger  { background: #fee2e2; color: #991b1b; }

        /* ── Modal overlay ── */
        .modal-overlay {
          display: none; position: fixed; inset: 0;
          background: rgba(0,0,0,.45); z-index: 200;
          align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
          background: #fff; border-radius: 14px; width: 480px; max-width: 95vw;
          max-height: 90vh; overflow-y: auto; padding: 28px 28px 24px;
          box-shadow: 0 20px 60px rgba(0,0,0,.18);
        }
        .modal-header {
          display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
        }
        .modal-title { font-size: 17px; font-weight: 800; color: #111827; }
        .modal-close {
          background: none; border: 0; cursor: pointer; font-size: 20px;
          color: #9ca3af; line-height: 1; padding: 2px 6px; border-radius: 6px;
        }
        .modal-close:hover { background: #f1f5f9; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 5px; }
        .form-group input, .form-group select {
          width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 8px;
          padding: 0 12px; font-size: 13px; color: #111827; background: #fff;
        }
        .form-group input:focus, .form-group select:focus {
          outline: none; border-color: #19c45b; box-shadow: 0 0 0 3px rgba(25,196,91,.12);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .btn-cancel {
          background: #f1f5f9; border: 0; border-radius: 8px; padding: 9px 18px;
          font-size: 13px; font-weight: 700; color: #374151; cursor: pointer;
        }
        .btn-cancel:hover { background: #e2e8f0; }
        .btn-save {
          background: #19c45b; color: #fff; border: 0; border-radius: 8px;
          padding: 9px 22px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .btn-save:hover { background: #15ad4e; }
        .btn-save:disabled { opacity: .6; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="admin-shell">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div>
            <div class="brand">
                <div class="brand-mark">S</div>
                Spring Market
            </div>
            <nav class="side-nav">
                <a class="side-item" href="dashboard.html"><span class="side-icon">📊</span> Dashboard</a>
                <a class="side-item active" href="productos.html"><span class="side-icon">📦</span> Productos</a>
                <a class="side-item" href="ventas.html"><span class="side-icon">🛒</span> Ventas</a>
                <a class="side-item" href="sucursales.html"><span class="side-icon">🏪</span> Sucursales</a>
                <a class="side-item admin-only" href="proveedores.html"><span class="side-icon">🚚</span> Proveedores</a>
                <a class="side-item" href="reportes.html"><span class="side-icon">📋</span> Reportes</a>
            </nav>
        </div>
    </aside>

    <!-- Main -->
    <main class="prod-main">

        <!-- Topbar -->
        <div class="topbar">
            <div class="top-actions">
                <div class="manager">
                    <div>
                        <div class="manager-name" id="user-name">Usuario</div>
                        <span class="manager-role" id="user-role">ROL</span>
                    </div>
                    <div class="avatar" id="avatar">U</div>
                </div>
            </div>
        </div>

        <!-- Page header -->
        <div class="page-header">
            <div>
                <h1>Catálogo de Productos</h1>
                <p>Gestiona el inventario de productos del supermercado.</p>
            </div>
            <button class="btn-primary admin-only" id="btn-nuevo">
                ＋ Nuevo producto
            </button>
        </div>

        <!-- Alert -->
        <div id="alert-box"></div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-wrap">
                <input type="text" id="search-input" placeholder="Buscar producto...">
            </div>
            <select id="cat-filter">
                <option value="">Todas las categorías</option>
            </select>
            <select id="stock-filter">
                <option value="">Todos los estados</option>
                <option value="ok">Con stock</option>
                <option value="low">Stock bajo (≤5)</option>
                <option value="out">Sin stock</option>
            </select>
        </div>

        <!-- Grid -->
        <div class="cat-grid" id="productos-grid">
            <div class="state-msg">Cargando productos...</div>
        </div>

    </main>
</div>

<!-- Modal agregar / editar -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Nuevo producto</span>
            <button class="modal-close" id="modal-close" title="Cerrar">&times;</button>
        </div>

        <div id="modal-alert" style="display:none;margin-bottom:12px;padding:9px 12px;border-radius:7px;font-size:12px;font-weight:600;"></div>

        <input type="hidden" id="prod-id">

        <div class="form-group">
            <label for="prod-nombre">Nombre *</label>
            <input type="text" id="prod-nombre" placeholder="Ej. Leche entera 1L">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="prod-precio">Precio ($) *</label>
                <input type="number" id="prod-precio" min="0.01" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="prod-stock">Stock</label>
                <input type="number" id="prod-stock" min="0" step="1" placeholder="0">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="prod-categoria">Categoría</label>
                <select id="prod-categoria">
                    <option value="">Sin categoría</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prod-proveedor">Proveedor</label>
                <select id="prod-proveedor">
                    <option value="">Sin proveedor</option>
                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" id="btn-cancel">Cancelar</button>
            <button class="btn-save" id="btn-save">Guardar</button>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    if (!Auth.requireAuth(['ADMIN', 'CAJERO'])) throw new Error('No autorizado');

    const cargo  = localStorage.getItem('cargo');
    const nombre = localStorage.getItem('nombre') || 'Usuario';

    document.getElementById('user-name').textContent = nombre;
    document.getElementById('avatar').textContent =
      nombre.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('user-role').textContent =
      cargo === 'ADMIN' ? 'INVENTORY MANAGER' : 'CAJERO';

    // Ocultar controles de admin para cajero
    if (cargo !== 'ADMIN') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    }

    // ── Estado ────────────────────────────────────────
    const state = { productos: [], categorias: [], proveedores: [] };

    // ── Alerta principal ──────────────────────────────
    function alerta(tipo, msg) {
      const el = document.getElementById('alert-box');
      el.className = `alert-${tipo} show`;
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // ── Render grid ───────────────────────────────────
    const PRODUCT_ICONS = {
      box: '📦',
      milk: '🥛',
      meat: '🥩',
      fruit: '🍎',
      drink: '🥤',
      bread: '🥖',
      clean: '🧼',
      snack: '🍪'
    };
    function iconForProduct(producto) {
      const cat = (producto.categoria?.nombre || '').toLowerCase();
      if (cat.includes('lact')) return PRODUCT_ICONS.milk;
      if (cat.includes('carne')) return PRODUCT_ICONS.meat;
      if (cat.includes('fruta') || cat.includes('verdura')) return PRODUCT_ICONS.fruit;
      if (cat.includes('bebida')) return PRODUCT_ICONS.drink;
      if (cat.includes('pan')) return PRODUCT_ICONS.bread;
      if (cat.includes('limpieza')) return PRODUCT_ICONS.clean;
      if (cat.includes('snack')) return PRODUCT_ICONS.snack;
      return PRODUCT_ICONS.box;
    }

    function stockInfo(stock) {
      if (!stock || stock === 0) return { label: 'Sin stock', cls: 'badge-out' };
      if (stock <= 5) return { label: `Stock bajo`, cls: 'badge-low' };
      return { label: 'Disponible', cls: 'badge-ok' };
    }

    function renderGrid() {
      const query      = document.getElementById('search-input').value.trim().toLowerCase();
      const catId      = document.getElementById('cat-filter').value;
      const stockF     = document.getElementById('stock-filter').value;
      const grid       = document.getElementById('productos-grid');

      const filtrados = state.productos.filter(p => {
        const matchNombre = !query || p.nombre.toLowerCase().includes(query);
        const matchCat    = !catId  || String(p.categoria?.id) === catId;
        const s = p.stock || 0;
        const matchStock  = !stockF
          || (stockF === 'ok'  && s > 5)
          || (stockF === 'low' && s > 0 && s <= 5)
          || (stockF === 'out' && s === 0);
        return matchNombre && matchCat && matchStock;
      });

      if (!filtrados.length) {
        grid.innerHTML = '<div class="state-msg">No se encontraron productos.</div>';
        return;
      }

      const esAdmin = cargo === 'ADMIN';
      grid.innerHTML = filtrados.map(p => {
        const { label, cls } = stockInfo(p.stock);
        const cat = p.categoria?.nombre || 'Sin categoría';
        return `<div class="prod-card">
          <div class="prod-card-top">
            <div class="prod-icon">${iconForProduct(p)}</div>
            <span class="prod-badge ${cls}">${label}</span>
          </div>
          <div class="prod-name">${p.nombre}</div>
          <div class="prod-meta">${cat}</div>
          <div class="prod-price">${formatPrice(p.precio)}</div>
          <div class="prod-stock-line">${p.stock || 0} unidades en inventario</div>
          ${esAdmin ? `<div class="card-actions">
            <button class="btn-edit" onclick="abrirEditar(${p.id})">✏️ Editar</button>
            <button class="btn-del"  onclick="eliminar(${p.id}, '${p.nombre.replace(/'/g,"\\'")}')">🗑️ Eliminar</button>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    // ── Cargar datos ──────────────────────────────────
    async function cargar() {
      try {
        const [prods, cats, provs] = cargo === 'ADMIN'
          ? await Promise.all([Productos.listar(), Categorias.listar(), Proveedores.listar()])
          : [await Productos.listar(), await Categorias.listar(), []];
        state.productos   = prods;
        state.categorias  = cats;
        state.proveedores = provs;

        // Poblar filtro de categorías
        const catSel = document.getElementById('cat-filter');
        catSel.innerHTML = '<option value="">Todas las categorías</option>' +
          cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

        // Poblar selects del modal
        const modalCat  = document.getElementById('prod-categoria');
        const modalProv = document.getElementById('prod-proveedor');
        modalCat.innerHTML  = '<option value="">Sin categoría</option>' +
          cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        modalProv.innerHTML = '<option value="">Sin proveedor</option>' +
          provs.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');

        renderGrid();
      } catch (err) {
        document.getElementById('productos-grid').innerHTML =
          `<div class="state-msg">Error al cargar productos: ${err.message}</div>`;
      }
    }

    // ── Modal ─────────────────────────────────────────
    function abrirModal(titulo) {
      document.getElementById('modal-title').textContent = titulo;
      document.getElementById('modal-alert').style.display = 'none';
      document.getElementById('btn-save').disabled = false;
      document.getElementById('modal-overlay').classList.add('open');
    }

    function cerrarModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.getElementById('prod-id').value      = '';
      document.getElementById('prod-nombre').value  = '';
      document.getElementById('prod-precio').value  = '';
      document.getElementById('prod-stock').value   = '';
      document.getElementById('prod-categoria').value = '';
      document.getElementById('prod-proveedor').value = '';
    }

    function abrirNuevo() {
      cerrarModal();
      abrirModal('Nuevo producto');
    }

    function abrirEditar(id) {
      const p = state.productos.find(x => x.id === id);
      if (!p) return;
      document.getElementById('prod-id').value     = p.id;
      document.getElementById('prod-nombre').value = p.nombre;
      document.getElementById('prod-precio').value = p.precio;
      document.getElementById('prod-stock').value  = p.stock || 0;
      document.getElementById('prod-categoria').value = p.categoria?.id || '';
      document.getElementById('prod-proveedor').value = p.proveedor?.id || '';
      abrirModal('Editar producto');
    }

    // ── Guardar ───────────────────────────────────────
    async function guardar() {
      const nombre  = document.getElementById('prod-nombre').value.trim();
      const precio  = parseFloat(document.getElementById('prod-precio').value);
      const stock   = parseInt(document.getElementById('prod-stock').value) || 0;
      const catId   = document.getElementById('prod-categoria').value;
      const provId  = document.getElementById('prod-proveedor').value;
      const id      = document.getElementById('prod-id').value;

      const errEl = document.getElementById('modal-alert');
      if (!nombre) {
        errEl.textContent = 'El nombre es obligatorio.';
        errEl.style.cssText = 'display:block;background:#fee2e2;color:#991b1b;';
        return;
      }
      if (!precio || precio <= 0) {
        errEl.textContent = 'El precio debe ser mayor a $0.00.';
        errEl.style.cssText = 'display:block;background:#fee2e2;color:#991b1b;';
        return;
      }
      errEl.style.display = 'none';

      const payload = {
        nombre, precio, stock,
        categoria:  catId  ? { id: parseInt(catId)  } : null,
        proveedor:  provId ? { id: parseInt(provId) } : null
      };

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        if (id) {
          await Productos.actualizar(id, payload);
          alerta('success', '✅ Producto actualizado correctamente.');
        } else {
          await Productos.crear(payload);
          alerta('success', '✅ Producto creado correctamente.');
        }
        cerrarModal();
        await cargar();
      } catch (err) {
        errEl.textContent = 'Error: ' + err.message;
        errEl.style.cssText = 'display:block;background:#fee2e2;color:#991b1b;';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }

    // ── Eliminar ──────────────────────────────────────
    async function eliminar(id, nombre) {
      if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;
      try {
        await Productos.eliminar(id);
        alerta('success', `🗑️ "${nombre}" eliminado.`);
        await cargar();
      } catch (err) {
        alerta('danger', 'Error al eliminar: ' + err.message);
      }
    }

    // ── Event listeners ───────────────────────────────
    document.getElementById('btn-nuevo').addEventListener('click', abrirNuevo);
    document.getElementById('btn-save').addEventListener('click', guardar);
    document.getElementById('btn-cancel').addEventListener('click', cerrarModal);
    document.getElementById('modal-close').addEventListener('click', cerrarModal);
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) cerrarModal();
    });

    document.getElementById('search-input').addEventListener('input', renderGrid);
    document.getElementById('cat-filter').addEventListener('change', renderGrid);
    document.getElementById('stock-filter').addEventListener('change', renderGrid);

    // ── Iniciar ───────────────────────────────────────
    cargar();
</script>
</body>
</html>
