<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Market - Proveedores</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background:#f4f7ef; color:#111827; }
    .admin-shell { min-height:100vh; display:grid; grid-template-columns:255px 1fr; }
    .admin-sidebar { background:#b8f2c9; border-right:1px solid rgba(34,197,94,.25); padding:22px 20px; display:flex; flex-direction:column; gap:42px; position:sticky; top:0; height:100vh; }
    .brand { display:flex; align-items:center; gap:9px; color:#19c45b; font-weight:800; font-size:16px; }
    .brand-mark { width:24px; height:24px; border-radius:50%; background:#16d45b; color:#fff; display:grid; place-items:center; font-weight:800; }
    .side-nav { display:flex; flex-direction:column; gap:14px; margin-top:34px; }
    .side-item { display:flex; align-items:center; gap:11px; padding:10px 7px; color:#345246; text-decoration:none; font-size:13px; border-radius:8px; border:0; background:transparent; cursor:pointer; font-family:var(--font-main); }
    .side-item.active, .side-item:hover { color:#153826; background:rgba(255,255,255,.32); }
    .side-icon { width:18px; text-align:center; }
    .logout { margin-top:auto; color:#ef4444; }
    .provider-main { padding:24px 28px 36px; overflow-x:hidden; }
    .topbar { display:flex; align-items:center; margin-bottom:22px; }
    .top-actions { margin-left:auto; display:flex; align-items:center; gap:18px; }
    .manager { display:flex; align-items:center; gap:12px; padding-left:18px; border-left:1px solid #dbe3dc; }
    .manager-name { font-size:12px; font-weight:800; text-align:right; line-height:1.1; }
    .manager-role { display:block; font-size:8px; color:#64748b; letter-spacing:.08em; }
    .avatar { width:34px; height:34px; border-radius:50%; background:#1f2937; color:#fff; display:grid; place-items:center; font-weight:800; }
    .page-header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .page-header h1 { font-size:26px; font-weight:800; margin:0 0 3px; }
    .page-header p { color:#64748b; font-size:13px; margin:0; }
    .btn-primary-local { background:#19c45b; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:800; cursor:pointer; }
    .provider-layout { display:grid; grid-template-columns:250px 1fr; gap:18px; align-items:start; }
    .panel, .provider-card { background:#fff; border:1px solid #e6ebef; border-radius:8px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
    .panel { padding:18px; }
    .panel-title { font-size:15px; font-weight:900; margin-bottom:14px; }
    .category-list { display:grid; gap:8px; }
    .category-btn { text-align:left; border:1px solid #e2e8f0; background:#f8fafc; color:#334155; border-radius:8px; padding:10px; cursor:pointer; font-weight:800; font-size:12px; }
    .category-btn.active { background:#dcfce7; border-color:#86efac; color:#07883f; }
    .toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar input { background:#fff; max-width:360px; }
    .provider-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px; }
    .provider-card { padding:18px; }
    .provider-type { display:inline-flex; background:#f0fdf4; color:#07883f; border:1px solid #bbf7d0; border-radius:999px; padding:4px 10px; font-size:10px; font-weight:900; margin-bottom:10px; }
    .provider-title { font-size:16px; font-weight:900; margin-bottom:8px; color:#111827; }
    .provider-line { font-size:13px; color:#475569; margin:6px 0; }
    .provider-label { color:#94a3b8; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.07em; }
    .provider-products { margin-top:10px; padding-top:10px; border-top:1px solid #edf1f4; color:#64748b; font-size:12px; }
    .card-actions { display:flex; gap:8px; }
    .btn-edit, .btn-del { flex:1; border:0; border-radius:7px; padding:8px 10px; font-size:12px; font-weight:800; cursor:pointer; }
    .btn-edit { background:#e0f2fe; color:#0369a1; }
    .btn-del { background:#fee2e2; color:#991b1b; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:300; align-items:center; justify-content:center; padding:18px; }
    .modal-overlay.open { display:flex; }
    .modal { background:#fff; width:560px; max-width:96vw; border-radius:12px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.18); }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .modal-title { font-size:17px; font-weight:900; }
    .close-btn { border:0; background:#fee2e2; color:#991b1b; border-radius:8px; width:32px; height:32px; cursor:pointer; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    @media(max-width:980px) { .provider-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div>
      <div class="brand"><span class="brand-mark">S</span> Spring Market</div>
      <nav class="side-nav">
        <a class="side-item" href="dashboard.html"><span class="side-icon">📊</span> Dashboard</a>
        <a class="side-item" href="productos.html"><span class="side-icon">📦</span> Productos</a>
        <a class="side-item" href="ventas.html"><span class="side-icon">🛒</span> Ventas</a>
        <a class="side-item" href="sucursales.html"><span class="side-icon">🏪</span> Sucursales</a>
        <a class="side-item active" href="proveedores.html"><span class="side-icon">🚚</span> Proveedores</a>
        <a class="side-item" href="reportes.html"><span class="side-icon">📋</span> Reportes</a>
      </nav>
    </div>
  </aside>

  <main class="provider-main">
    <div class="topbar">
      <div class="top-actions">
        <div class="manager">
          <div><div class="manager-name" id="user-name">Usuario</div><span class="manager-role">ADMINISTRADOR</span></div>
          <div class="avatar" id="avatar">A</div>
        </div>
      </div>
    </div>

    <div class="page-header">
      <div>
        <h1>Directorio de Proveedores</h1>
        <p>Contactos, ubicaciones y categorias de suministro registradas en SQL.</p>
      </div>
      <button class="btn-primary-local" onclick="abrirModal()">Nuevo proveedor</button>
    </div>

    <section class="provider-layout">
      <aside class="panel">
        <div class="panel-title">Categorias</div>
        <div class="category-list" id="category-list"></div>
      </aside>
      <section class="panel">
        <div class="toolbar"><input id="search" type="search" placeholder="Buscar proveedor, contacto o producto..."></div>
        <div class="provider-grid" id="provider-grid"><div class="empty-state">Cargando proveedores...</div></div>
      </section>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modal-title">Nuevo proveedor</div><button class="close-btn" onclick="cerrarModal()">x</button></div>
    <input type="hidden" id="provider-id">
    <div class="form-group"><label>Nombre</label><input id="provider-name"></div>
    <div class="form-grid">
      <div class="form-group"><label>Contacto</label><input id="provider-contact"></div>
      <div class="form-group"><label>Telefono</label><input id="provider-phone"></div>
    </div>
    <div class="form-group"><label>Email</label><input id="provider-email"></div>
    <div class="form-group"><label>Direccion</label><input id="provider-address"></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary-local" onclick="guardarProveedor()">Guardar</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  if (!Auth.requireAuth(['ADMIN'])) throw new Error('No autorizado');
  const nombre = localStorage.getItem('nombre') || 'Administrador';
  const state = { proveedores: [], productos: [], categoria: 'Todos' };
  const tipos = [
    { nombre: 'Todos', pistas: [], ejemplos: 'Todos los proveedores registrados.' },
    { nombre: 'Proveedor de abarrotes', pistas: ['distribuidora', 'nacional', 'abarrotes', 'granos'], ejemplos: 'Arroz, frijoles, azucar, aceite, pastas y enlatados.' },
    { nombre: 'Proveedor de frutas y verduras', pistas: ['fruta', 'fresca', 'agricola', 'verdura'], ejemplos: 'Productos frescos agricolas.' },
    { nombre: 'Proveedor de lacteos', pistas: ['lacteo', 'lacteos', 'valle', 'leche', 'queso', 'yogurt'], ejemplos: 'Leche, queso, yogurt y derivados.' },
    { nombre: 'Proveedor general', pistas: [], ejemplos: 'Mercaderia mixta y suministros complementarios.' }
  ];

  document.getElementById('user-name').textContent = nombre;
  document.getElementById('avatar').textContent = nombre.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();

  async function cargar() {
    const [proveedores, productos] = await Promise.all([Proveedores.listar(), Productos.listar()]);
    state.proveedores = proveedores || [];
    state.productos = productos || [];
    renderCategorias();
    renderProveedores();
  }

  function productosProveedor(id) {
    return state.productos.filter(p => String(p.proveedor?.id || '') === String(id));
  }

  function tipoProveedor(proveedor) {
    const productos = productosProveedor(proveedor.id);
    const texto = [proveedor.nombre, proveedor.contacto, proveedor.direccion, ...productos.map(p => p.nombre + ' ' + (p.categoria?.nombre || ''))].join(' ').toLowerCase();
    return tipos.find(t => t.nombre !== 'Todos' && t.nombre !== 'Proveedor general' && t.pistas.some(p => texto.includes(p))) || tipos[tipos.length - 1];
  }

  function renderCategorias() {
    document.getElementById('category-list').innerHTML = tipos.map(t => `<button class="category-btn ${state.categoria === t.nombre ? 'active' : ''}" onclick="seleccionarCategoria('${t.nombre}')">
      ${t.nombre}<br><span style="font-weight:600;color:#64748b">${t.ejemplos}</span>
    </button>`).join('');
  }

  function seleccionarCategoria(nombre) {
    state.categoria = nombre;
    renderCategorias();
    renderProveedores();
  }

  function renderProveedores() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const lista = state.proveedores.filter(p => {
      const tipo = tipoProveedor(p);
      const productos = productosProveedor(p.id);
      const texto = [p.nombre, p.contacto, p.telefono, p.email, p.direccion, tipo.nombre, ...productos.map(x => x.nombre)].join(' ').toLowerCase();
      const matchCategoria = state.categoria === 'Todos' || tipo.nombre === state.categoria;
      return matchCategoria && (!q || texto.includes(q));
    });
    const grid = document.getElementById('provider-grid');
    if (!lista.length) {
      grid.innerHTML = '<div class="empty-state">No hay proveedores para mostrar.</div>';
      return;
    }
    grid.innerHTML = lista.map(p => {
      const tipo = tipoProveedor(p);
      const productos = productosProveedor(p.id);
      const productosTexto = productos.length ? productos.map(x => x.nombre).join(', ') : tipo.ejemplos;
      return `<article class="provider-card">
        <span class="provider-type">${tipo.nombre}</span>
        <div class="provider-title">${p.nombre}</div>
        <div class="provider-line"><span class="provider-label">Contacto</span><br>${p.contacto || '-'}</div>
        <div class="provider-line"><span class="provider-label">Telefono</span><br>${p.telefono || '-'}</div>
        <div class="provider-line"><span class="provider-label">Email</span><br>${p.email || '-'}</div>
        <div class="provider-line"><span class="provider-label">Direccion</span><br>${p.direccion || '-'}</div>
        <div class="provider-products"><strong>Productos:</strong> ${productosTexto}</div>
        <div class="card-actions" style="margin-top:14px"><button class="btn-edit" onclick="editar(${p.id})">Editar</button><button class="btn-del" onclick="eliminar(${p.id})">Eliminar</button></div>
      </article>`;
    }).join('');
  }

  function abrirModal() {
    document.getElementById('modal-title').textContent = 'Nuevo proveedor';
    ['provider-id','provider-name','provider-contact','provider-phone','provider-email','provider-address'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('modal').classList.add('open');
  }
  function cerrarModal() { document.getElementById('modal').classList.remove('open'); }
  function editar(id) {
    const p = state.proveedores.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').textContent = 'Editar proveedor';
    document.getElementById('provider-id').value = p.id;
    document.getElementById('provider-name').value = p.nombre || '';
    document.getElementById('provider-contact').value = p.contacto || '';
    document.getElementById('provider-phone').value = p.telefono || '';
    document.getElementById('provider-email').value = p.email || '';
    document.getElementById('provider-address').value = p.direccion || '';
    document.getElementById('modal').classList.add('open');
  }
  async function guardarProveedor() {
    const id = document.getElementById('provider-id').value;
    const payload = {
      nombre: document.getElementById('provider-name').value.trim(),
      contacto: document.getElementById('provider-contact').value.trim(),
      telefono: document.getElementById('provider-phone').value.trim(),
      email: document.getElementById('provider-email').value.trim(),
      direccion: document.getElementById('provider-address').value.trim()
    };
    if (!payload.nombre) return alert('El nombre es obligatorio.');
    id ? await Proveedores.actualizar(id, payload) : await Proveedores.crear(payload);
    cerrarModal();
    await cargar();
  }
  async function eliminar(id) {
    if (!confirm('Eliminar este proveedor?')) return;
    await Proveedores.eliminar(id);
    await cargar();
  }

  document.getElementById('search').addEventListener('input', renderProveedores);
  cargar().catch(e => document.getElementById('provider-grid').innerHTML = '<div class="empty-state">' + e.message + '</div>');
</script>
</body>
</html>
